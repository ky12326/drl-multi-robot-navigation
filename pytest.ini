[pytest]
testpaths = tests
pythonpath = src/drl_navigation_ros2
# ROS Foxy ships ament/launch_testing pytest plugins built for old pytest;
# they crash under pytest 8, so disable them for our unit suite.
addopts = -q -p no:launch -p no:launch_ros -p no:ament_lint -p no:ament_pep257 -p no:ament_flake8 -p no:ament_xmllint -p no:ament_copyright
